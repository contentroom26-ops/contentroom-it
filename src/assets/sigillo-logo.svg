<svg width="290" height="72" viewBox="0 0 290 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400&amp;display=swap');
      .wordmark { font-family: 'Josefin Sans', sans-serif; font-size: 58px; font-weight: 400; fill: #b8a06a; letter-spacing: 6px; }
    </style>
  </defs>
  <text x="12" y="58" class="wordmark">SIGILL</text>
  <!-- y=16 = allineata al cap-height. x=242 = gap leggermente più ampio rispetto alle altre lettere -->
