    <rect x="0" y="0" width="36" height="42" rx="4" ry="4"
          fill="none" stroke="#b8a06a" stroke-width="4" stroke-linejoin="round"/>
    <line x1="0" y1="21" x2="36" y2="21"
          stroke="#b8a06a" stroke-width="4" stroke-linecap="square"/>
    <circle cx="18" cy="21" r="3.5" fill="#b8a06a"/>
  </g>
</svg>
